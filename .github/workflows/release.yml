name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: MVN

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Extract and validate version from tag
      id: version
      run: |
        TAG="${{ github.event.release.tag_name }}"
        VERSION="${TAG#v}"
        if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "Error: '$VERSION' is not valid semver (expected X.Y.Z)"
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Set version in pom.xml
      run: mvn versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

    - name: Build release JAR
      run: mvn package -DskipTests

    - name: Upload JAR to release
      run: |
        gh release upload "${{ github.event.release.tag_name }}" \
          "target/ndex-object-model-${{ steps.version.outputs.version }}.jar" \
          --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy to Maven repository
      run: mvn deploy -DskipTests
      env:
        REPO_USER: ${{ secrets.REPO_USER }}
        REPO_PWD: ${{ secrets.REPO_PWD }}
